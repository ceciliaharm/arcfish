<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcFish | On-Chain Fishing</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container">
    <header>
      <div class="logo">🎣 ArcFish</div>
      <p class="tagline">On-Chain Fishing on Arc Testnet</p>
    </header>

    <div class="wallet-section">
      <button id="connectBtn" class="btn-connect">Connect Wallet</button>
      <div id="walletInfo" class="wallet-info">Not connected</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Score</span>
        <span id="score" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Fish</span>
        <span id="fishCount" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Reward</span>
        <span id="reward" class="stat-value">0 USDC</span>
      </div>
    </div>

    <div class="game-area" id="gameArea">
      <div class="sky"></div>
      <div class="water">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
      </div>
      <div class="boat">🚤</div>
      <div class="hook" id="hook">🪝</div>
      <div id="particles"></div>
    </div>

    <div class="controls">
      <button id="castBtn" class="btn-primary" disabled>🎣 Cast Line</button>
      <button id="claimBtn" class="btn-secondary" disabled>💰 Claim Reward</button>
    </div>

    <div class="faucet-card">
      <h3>💧 Need Testnet USDC?</h3>
      <a href="https://faucet.circle.com" target="_blank" class="btn-faucet">
        Open Circle Faucet
      </a>
      <p class="network-info">Arc Testnet • Chain ID 5042002</p>
    </div>

    <div id="message" class="message"></div>
    <div id="txStatus" class="tx-status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
