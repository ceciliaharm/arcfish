<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcFish | On-Chain Fishing</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <div class="bg"></div>

  <!-- START SCREEN -->
  <div id="startScreen" class="start-screen">
    <div class="start-box">
      <div class="logo">🎣 ArcFish</div>
      <p>On-Chain Fishing on Arc Testnet</p>
      
      <div id="usernameStep">
        <h2>Masukkan Username</h2>
        <input type="text" id="usernameInput" maxlength="16" placeholder="Username (3-16 karakter)" />
        <button id="setUsernameBtn" class="btn">Lanjut</button>
        <p class="hint">Username hanya bisa diisi sekali selamanya</p>
      </div>
    </div>
  </div>

  <!-- MAIN GAME -->
  <div id="game" class="game hidden">
    <div class="top-bar">
      <div class="player">
        <span id="playerName">Player</span>
      </div>
      <div class="stats">
        <div>Score: <b id="score">0</b></div>
        <div>Fish: <b id="fishCount">0</b></div>
      </div>
    </div>

    <div class="main">
      <!-- GAME AREA -->
      <div class="fishing-area" id="fishingArea">
        <div class="sky"></div>
        <div class="boat">🚢</div>
        <div class="fisher" id="fisher">🎣</div>
        <div class="water">
          <div class="coral c1">🪸</div>
          <div class="coral c2">🪨</div>
          <div class="coral c3">🌿</div>
          <div class="coral c4">🪸</div>
        </div>
        <div class="hook" id="hook">🪝</div>
        <div id="struggle" class="struggle hidden"></div>
        <div id="particles"></div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button id="connectBtn" class="btn btn-wallet">Connect Wallet</button>
        <button id="castBtn" class="btn btn-cast" disabled>🎣 Cast Line (On-Chain)</button>
        <div id="walletInfo" class="wallet-info">Not connected</div>
      </div>

      <div class="faucet">
        <a href="https://faucet.circle.com" target="_blank">Get Testnet USDC (Circle Faucet)</a>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="leaderboard">
      <h3>🏆 Top 100</h3>
      <div id="leaderboardList" class="lb-list"></div>
      <button id="saveScoreBtn" class="btn btn-save">Save Score</button>
    </div>
  </div>

  <!-- CATCH MODAL -->
  <div id="catchModal" class="modal hidden">
    <div class="modal-box">
      <div id="catchEmoji" class="big-emoji">🐟</div>
      <div id="catchName" class="catch-name">Fish</div>
      <div id="catchPoints" class="catch-points">+0 pts</div>
      <button id="closeModal" class="btn">Nice!</button>
    </div>
  </div>

  <div id="message" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
